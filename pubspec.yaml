name: memento
description: "A minimalist Android application built with Flutter that allows users to create a single note that remains visible on the lock screen."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_overlay_window: ^0.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

flutter_native_splash:
  color: "#0B0B0B"
  image: assets/images/logo.png

  android: true
  ios: false

  android_12:
    color: "#0B0B0B"
    image: assets/images/logo.png
    icon_background_color: "#0B0B0B"